<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <!-- Background is transparent so it looks good in dark/light themes -->
  <rect width="64" height="64" fill="none"/>
  <!-- Centered flame emoji; font stack covers major platforms -->
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle"
        font-size="48"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, Twemoji Mozilla, EmojiOne, Noto Emoji, sans-serif">
    🔥
  </text>
</svg>
